name: Docs

# Сборка и публикация документации на GitHub Pages:
#   https://maisiq.github.io/cdekx/


on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; текущий не отменяем — это production-окружение.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `-e .` обязателен: плагин mkdocstrings резолвит `::: cdekx.CdekClient`
      # и прочие ссылки из docs/reference/*.md через импорт пакета.
      # Дальше — ровно группа `docs` из [dependency-groups].
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "mkdocs>=1.6" "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26"

      # PYTHONPATH=. — в mkdocs.yml есть `hooks: mkdocs_hooks.py` и
      # `slugify: !!python/name:mkdocs_hooks.slugify`, а mkdocs 1.6+ не добавляет
      # каталог конфига в sys.path сам. Без этого сборка падает на загрузке YAML.
      # Тот же приём, что в `make docs`.
      - name: Build site
        run: PYTHONPATH=. mkdocs build --strict

      - uses: actions/configure-pages@v5

      # mkdocs кладёт результат в site/ (каталог в .gitignore).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Report canonical URL
        run: |
          echo "site_url из mkdocs.yml:"
          grep -E '^site_url:' mkdocs.yml
          echo "страниц в собранном сайте: $(find site -name '*.html' | wc -l)"
          echo "sitemap.xml: $([ -f site/sitemap.xml ] && echo есть || echo НЕТ)"
          # Проверка, что include CONTRIBUTING.md действительно сработал,
          # а не отрендерился как литерал `--8<-- "CONTRIBUTING.md"`.
          if grep -rq -- '--8<--' site/contributing/index.html; then
            echo "::error::pymdownx.snippets не сработал — на странице остался литерал --8<--"
            exit 1
          fi
          grep -q "Настройка окружения" site/contributing/index.html \
            || { echo "::error::CONTRIBUTING.md не включился в docs/contributing.md"; exit 1; }
          echo "include CONTRIBUTING.md сработал ✔"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Деплоим только с master: ручной запуск с другой ветки не должен
    # перезаписывать опубликованную документацию.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
